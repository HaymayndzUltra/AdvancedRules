name: rag-check
on: [push, pull_request]

jobs:
  rag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Sanity check CLI
        run: |
          # Verify module import works
          python -c "import cli, sys; from cli.main import main; print('OK: import main')"
          
          # Test CLI module invocation
          echo "Testing CLI module invocation..."
          PYTHONPATH=$PWD python -m cli.main --help | head -3

      - name: RAG index (uses your CLI)
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        run: |
          set -euxo pipefail
          # Always use the module invocation for reliability
          PYTHONPATH=$PWD python -m cli.main memory index --src=. --namespaces=coder --persona=CODER_AI --reindex

      - name: RAG query
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        run: |
          set -euxo pipefail
          # Always use the module invocation for reliability
          PYTHONPATH=$PWD python -m cli.main memory query --persona=CODER_AI --query "flow_runner" --k=3
