version: "2.0"
defaults:
  one_step_policy: true
  min_confidence: 0.8

commands:
  - id: "planning-to-audit"
    role_from: "auditor_ai"
    trigger: "run_auditor"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "auditor_ai"
        - "--inputs"
        - "memory-bank/plan/Action_Plan.md"
    requires:
      states_any_of: ["planning_complete"]
      completed_steps_all_of: ["planning"]
    contexts:
      must_exist: ["memory-bank/plan/Action_Plan.md"]
    emits:
      sets_state: "audit_complete"
      add_completed_step: "audit"
    ui:
      label: "Run Auditor"
      reason: "Audit the planning output for quality and completeness"

  - id: "audit-to-verify"
    role_from: "principal_engineer_ai"
    trigger: "run_principal_engineer"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "principal_engineer_ai"
        - "--inputs"
        - "memory-bank/plan/Summary_Report.md"
    requires:
      states_any_of: ["audit_complete"]
      completed_steps_all_of: ["audit"]
    contexts:
      must_exist: ["memory-bank/plan/Summary_Report.md"]
    emits:
      sets_state: "verification_complete"
      add_completed_step: "verification"
    ui:
      label: "Run Principal Engineer Review"
      reason: "Verify audit results and provide final validation"

  - id: "flow-lint"
    role_from: "system"
    trigger: "lint_flow"
    run:
      shell:
        - "arx"
        - "flow"
        - "lint"
        - "--flow={{flow_id}}"
    ui:
      label: "Lint Flow"
      reason: "Validate flow definition syntax and structure"

  - id: "flow-run"
    role_from: "system"
    trigger: "execute_flow"
    run:
      shell:
        - "arx"
        - "flow"
        - "run"
        - "--flow={{flow_id}}"
        - "--task-id={{task_id}}"
        - "--dry-run"
    ui:
      label: "Execute Flow (Dry Run)"
      reason: "Run flow execution in dry-run mode for safety"

  - id: "flow-render"
    role_from: "system"
    trigger: "render_flow"
    run:
      shell:
        - "arx"
        - "flow"
        - "render"
        - "--flow={{flow_id}}"
        - "--out=.artifacts/{{flow_id}}.mmd"
    ui:
      label: "Render Flow Diagram"
      reason: "Generate visual representation of the flow"

  - id: "memory-index"
    role_from: "system"
    trigger: "index_memory"
    run:
      shell:
        - "arx"
        - "memory"
        - "index"
        - "--src={{src}}"
        - "--namespaces={{namespaces}}"
        - "--persona={{persona}}"
    ui:
      label: "Index Memory"
      reason: "Index content into hybrid memory system"

  - id: "memory-query"
    role_from: "system"
    trigger: "query_memory"
    run:
      shell:
        - "arx"
        - "memory"
        - "query"
        - "--persona={{persona}}"
        - "--query={{query}}"
        - "--k={{k}}"
    ui:
      label: "Query Memory"
      reason: "Search memory for relevant context"

  - id: "memory-doctor"
    role_from: "system"
    trigger: "diagnose_memory"
    run:
      shell:
        - "arx"
        - "memory"
        - "doctor"
    ui:
      label: "Diagnose Memory"
      reason: "Check memory system health and integrity"

  - id: "codegen-scaffold"
    role_from: "codegen_ai"
    trigger: "run_codegen"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "codegen_ai"
        - "--mode"
        - "SCAFFOLD"
    ui:
      label: "Generate Code Scaffold"
      reason: "Create initial code structure and templates"

  - id: "qa-validate"
    role_from: "qa_ai"
    trigger: "run_qa"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "qa_ai"
        - "--mode"
        - "VALIDATE"
    ui:
      label: "Run QA Validation"
      reason: "Execute quality assurance validation checks"

  - id: "security-scan"
    role_from: "security_ai"
    trigger: "run_security"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "security_ai"
        - "--mode"
        - "SAST"
    ui:
      label: "Run Security Scan"
      reason: "Perform static application security testing"

  - id: "deploy-package"
    role_from: "deploy_ai"
    trigger: "run_deploy"
    run:
      shell:
        - "python3"
        - "tools/run_role.py"
        - "deploy_ai"
        - "--mode"
        - "PACKAGE"
    ui:
      label: "Package for Deployment"
      reason: "Prepare application package for deployment"