name: rag-check
on: [push, pull_request]

jobs:
  rag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Sanity check CLI
        run: |
          # Verify module import works
          python -c "import cli, sys; from cli.main import main; print('OK: import main')"
          
          # Test CLI module invocation
          echo "Testing CLI module invocation..."
          python -m cli.main --help | head -3 || echo "CLI module test failed"

      - name: RAG index (uses your CLI) - OPTIONAL
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        continue-on-error: true
        run: |
          echo "Running RAG index (optional - may skip if deps missing)..."
          python -m cli.main memory index --src=. --namespaces=coder --persona=CODER_AI --reindex || {
            echo "⚠️ RAG index skipped (missing dependencies or CLI issue)"
            echo "This is optional and does not fail the build"
            exit 0
          }

      - name: RAG query - OPTIONAL
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        continue-on-error: true
        run: |
          echo "Running RAG query (optional - may skip if deps missing)..."
          python -m cli.main memory query --persona=CODER_AI --query "flow_runner" --k=3 || {
            echo "⚠️ RAG query skipped (missing dependencies or CLI issue)"
            echo "This is optional and does not fail the build"
            exit 0
          }