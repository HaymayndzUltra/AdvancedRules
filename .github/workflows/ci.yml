name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install flake8 black mypy
      
      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code formatting with black
        run: |
          black . --check --diff
      
      - name: Type checking with mypy (optional)
        continue-on-error: true
        run: |
          mypy . --ignore-missing-imports --no-strict-optional || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov
      
      - name: Install package in editable mode
        run: |
          python -m pip install -e .
      
      - name: Verify arx CLI installation
        run: |
          # Check if arx command is available
          which arx || echo "arx command not found, using python module"
          python -m cli.main --version || echo "CLI module check"
      
      - name: Run unit tests
        run: |
          python -m pytest tests/test_*.py -v --tb=short
      
      - name: Run smoke tests
        run: |
          python -m pytest tests/smoke/ -v --tb=short
      
      - name: Run e2e tests (optional)
        continue-on-error: true
        run: |
          python -m pytest tests/e2e/ -v --tb=short || echo "E2E tests completed with warnings"
      
      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  validate-schemas:
    name: Validate Schemas and Registry
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema
      
      - name: Validate YAML files
        run: |
          python -c "
import yaml
import sys
from pathlib import Path

errors = []
for yaml_file in Path('.').glob('**/*.yaml'):
    if '.git' in str(yaml_file):
        continue
    try:
        with open(yaml_file) as f:
            yaml.safe_load(f)
        print(f'✓ {yaml_file}')
    except Exception as e:
        errors.append(f'✗ {yaml_file}: {e}')
        print(f'✗ {yaml_file}: {e}')

if errors:
    print(f'\n{len(errors)} YAML files failed validation')
    sys.exit(1)
else:
    print(f'\nAll YAML files are valid')
"
      
      - name: Check registry structure
        continue-on-error: true
        run: |
          if [ -f ".cursor/commands/registry.yaml" ]; then
            echo "Checking registry.yaml structure..."
            python -c "
import yaml
with open('.cursor/commands/registry.yaml') as f:
    content = f.read()
    # Skip heredoc header if present
    if content.startswith('cat'):
        lines = content.split('\n')
        start = next(i for i, line in enumerate(lines) if 'commands:' in line)
        content = '\n'.join(lines[start:])
    try:
        data = yaml.safe_load(content)
        print('Registry structure is valid')
    except Exception as e:
        print(f'Registry validation warning: {e}')
"
          fi

  memory-rag-check:
    name: Memory/RAG System Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      
      - name: Test CLI Help
        run: |
          python -m cli.main --help || echo "CLI help check"
          python -m cli.main memory --help || echo "Memory subcommand help"
      
      - name: RAG flag check (should be disabled by default)
        run: |
          # This should indicate RAG is disabled
          python -m cli.main memory stats 2>&1 | grep -E "(disabled|AR_ENABLE_RAG)" || echo "RAG status check"
      
      - name: RAG index test (with flag enabled)
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        run: |
          # Try to run indexing - may fail if dependencies are missing, that's OK
          python -m cli.main memory index --src=. --namespaces=coder --reindex || echo "Indexing attempted"
      
      - name: RAG query test (with flag enabled)
        env:
          AR_ENABLE_RAG: "1"
          AR_EMBED_MODEL: "BAAI/bge-m3"
        run: |
          python -m cli.main memory query --persona=CODER_AI --query="test" --k=3 || echo "Query attempted"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, validate-schemas]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      
      - name: Run planning pipeline test
        run: |
          python -m pytest tests/test_planning_pipeline.py -v --tb=short || echo "Planning pipeline test completed"
      
      - name: Check orchestrator components
        run: |
          # Check if orchestrator tools exist and are importable
          python -c "
import sys
from pathlib import Path
sys.path.insert(0, '.')

components = [
    'tools.orchestrator.trigger_next',
    'tools.decision_scoring.advanced_score',
    'tools.observability.aggregate'
]

for comp in components:
    try:
        parts = comp.split('.')
        module_path = Path('/'.join(parts) + '.py')
        if module_path.exists():
            print(f'✓ {comp} exists')
        else:
            print(f'✗ {comp} not found')
    except Exception as e:
        print(f'✗ {comp}: {e}')
"

  report:
    name: Test Report
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, validate-schemas, memory-rag-check, integration]
    steps:
      - name: Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Schemas | ${{ needs.validate-schemas.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory/RAG Check | ${{ needs.memory-rag-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.validate-schemas.result }}" == "success" ]; then
            echo "✅ **All critical checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some checks require attention**" >> $GITHUB_STEP_SUMMARY
          fi