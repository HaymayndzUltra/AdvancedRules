
name: readme-sync-check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify READMEs current
        run: |
          python3 scripts/docs_readme_sync.py --check --inventory docs/SYSTEM_INVENTORY.md
